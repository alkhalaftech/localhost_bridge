name: localhost_bridge
description: 'Localhost HTTP bridge for Dart & Flutter: web pages and token clients (CLIs, AI agents) send commands; CORS, Local Network Access, DNS-rebinding guard and limits built in.'
version: 0.1.3

repository: https://github.com/alkhalaftech/localhost_bridge
issue_tracker: https://github.com/alkhalaftech/localhost_bridge/issues

topics:
  - http-server
  - localhost
  - cors
  - security
  - local-network

environment:
  sdk: ^3.8.0

# Policy: zero runtime dependencies — nothing outside dart: is imported
dependencies: {}


dev_dependencies:
  # dev-only runner — never reaches end users.
  test: ^1.24.0
  # Dart team's official lints — pana's scoring baseline.
  lints: ^6.0.0

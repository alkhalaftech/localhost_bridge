# CI for the localhost_bridge package repository.
# This file lives inside the package tree; the package root is the
# repository root. All paths below are therefore repository-root relative.
# Public repositories get free macOS and Windows minutes, so the full
# matrix runs on every push to main and on every pull request here.
# Tag pushes trigger nothing: a tag usually points at old code, and the
# release gates below already run on the main branch.
# The pana job below only spends its minutes where the repository
# variable SCHEDULED_CI is set to "true"; a repository that wants the
# score check sets that one variable. This file never names any
# repository, and it carries no self-starting triggers.
# Actions are pinned to full commit SHAs instead of mutable major tags -
# a supply-chain measure, so a moved tag cannot change what runs here.
# The workflow token is dropped to read-only: nothing here writes back.
name: dart

on:
  push:
    branches:
      - main
  pull_request:

# One run per ref: a new push or PR update cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          # Floor of the declared constraint sdk: ^3.8.0.
          - os: ubuntu-latest
            sdk: 3.8.0
          # The channel floor: the WebSocket channel's payload cap
          # (maxPayloadLength) exists exactly from 3.13, and arming the
          # channel below it refuses at construction - a job on this SDK
          # proves the minimum the channel guard assumes, running the
          # full suite with the channel tests active.
          - os: ubuntu-latest
            sdk: 3.13.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      # Name the environment a red run ran on: the dart SDK version and
      # the runner image build.
      - name: environment versions
        shell: bash
        run: |
          echo "dart SDK: $(dart --version 2>&1)"
          echo "runner image: ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      # The formatter takes the package language version from the resolved
      # package config; without it, it formats in the newest style.
      - name: resolve packages
        run: dart pub get

      # Only the stable entry judges style: the formatter takes the package
      # language version from the resolved package config, so the floor
      # entry measures function (pub get, analyze, test) and its older
      # style must not reject the newest-style sources.
      - name: format
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos: an info-level analyzer note fails the run, not
      # only warnings and errors.
      - name: analyze
        run: dart analyze --fatal-infos

      # The retired intake names never come back: lib carries exactly the
      # two documented rejection-site mentions of the legacy header (the
      # deprecation warning must name the old name to refuse it), and
      # neither the old generator, the old origin literal, nor the old
      # parameter spelling survives anywhere in lib - the fourth pattern
      # covers the interface name this package publishes (admit's and
      # verboseErrorsFor's parameter is bridgeToken, never portalToken).
      # A third mention - or one outside the server file - fails the run.
      - name: legacy intake names are gone from lib
        shell: bash
        # Every grep wraps in ( ... || true) before the count: this step
        # runs under bash -eo pipefail, where a grep that finds nothing
        # exits 1 and would fail the assignment - the clean tree is this
        # gate's pass condition, not its failure. A planted name still
        # prints a nonzero count and the check below turns it red; a
        # missing file makes grep exit 2 and the count 0, which fails
        # the expected srv=2 just the same.
        run: |
          gen="$( (grep -rn 'generatePortalToken' lib || true) | wc -l)"
          unk="$( (grep -rn 'unknown-portal' lib || true) | wc -l)"
          param="$( (grep -rn 'portalToken' lib || true) | wc -l)"
          legacy="$( (grep -rn 'X-Portal-Token' lib || true) | wc -l)"
          srv="$(grep -c 'X-Portal-Token' lib/src/local_intake_server.dart || true)"
          echo "gen=$gen unk=$unk param=$param legacy=$legacy srv=$srv"
          if [ "$gen" -eq 0 ] && [ "$unk" -eq 0 ] && [ "$param" -eq 0 ] && [ "$legacy" -eq "$srv" ] && [ "$srv" -eq 2 ]; then
            echo "legacy intake names: only the two documented rejection sites remain."
          else
            echo "::error::a retired intake name reappeared in lib (gen=$gen unk=$unk param=$param legacy=$legacy srv=$srv - expected gen=0 unk=0 param=0 legacy=srv=2)."
            exit 1
          fi

      # The suite runs serialized (-j 1): the RSS leak witness reads the
      # whole process, and neighbor isolates running concurrently put
      # sustained drift on that reading which no per-window pairing
      # reliably cancels on a two-core runner - serialized, the reading
      # is the witness's own process and the cap means what it says.
      # Serialization also removes the isolate starvation that broke
      # real-clock witnesses here before. Same tests, same assertions.
      #
      # The expanded reporter writes each failing test with an [E]
      # marker; the post-run awk repeats each failure block (and the
      # memory witness's numbers) as error annotations - readable from
      # the public API, so a red matrix run names its test and its
      # numbers without opening the admin-gated job log.
      - name: test
        shell: bash
        run: |
          status=0
          dart test -j 1 --reporter=expanded > "$RUNNER_TEMP/test_out.txt" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "MEM-WITNESS" "$RUNNER_TEMP/test_out.txt" | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done || true
            awk '/\[E\]/{c=7} c&&c-- {printf "::error::%s\n", substr($0,1,200)}' "$RUNNER_TEMP/test_out.txt" | head -40 || true
          fi
          tail -n 25 "$RUNNER_TEMP/test_out.txt" || true
          exit "$status"

      # Every browser run of the lab prints one LAB-RUN line naming its
      # evidence file and its wall time. Each line is repeated here as a
      # notice annotation, so the per-scene durations read from the public
      # API on a green run too - not only from the admin-gated job log.
      # The idle-timeout witness prints one IDLE-BOUNDS line the same way.
      # The grep is wrapped before the count: under bash -eo pipefail a
      # grep that finds nothing (an entry without a browser) exits 1, and
      # an entry with no run is this step's pass condition. A step keeps
      # ten notices at most, so the runs past the tenth ride in the step
      # after.
      - name: browser run durations
        shell: bash
        if: always()
        run: |
          (grep -E "^(LAB-RUN|IDLE-BOUNDS):" "$RUNNER_TEMP/test_out.txt" || true) > "$RUNNER_TEMP/lab_runs.txt"
          sed -n '1,10p' "$RUNNER_TEMP/lab_runs.txt" | while IFS= read -r line; do
            echo "::notice title=lab timing::${line:0:200}"
          done

      - name: browser run durations past the tenth
        shell: bash
        if: always()
        run: |
          (sed -n '11,60p' "$RUNNER_TEMP/lab_runs.txt" || true) | while IFS= read -r line; do
            echo "::notice title=lab timing::${line:0:200}"
          done

      # The body-limit witness prints one BODY-LIMIT line naming how long a
      # full-cap body sent in ordinary chunks took to be served. It rides
      # as a notice, so the margin to the body limit reads from the public
      # annotations on every runner.
      - name: body limit margin
        shell: bash
        if: always()
        run: |
          (grep -E "^BODY-LIMIT:" "$RUNNER_TEMP/test_out.txt" || true) | while IFS= read -r line; do
            echo "::notice title=body limit::${line:0:200}"
          done

      # The corpus pair that rides the TLS feed prints one TLS-CORPUS line
      # per case naming the status each door answered. The over-limit body
      # case rides as a notice, so its verdict on every runner - macOS
      # included - reads from the public annotations on a green run too.
      - name: TLS corpus pair verdicts
        shell: bash
        if: always()
        run: |
          (grep -E "^TLS-CORPUS: [^ ]+ 04_over_limit " "$RUNNER_TEMP/test_out.txt" || true) | while IFS= read -r line; do
            echo "::notice title=tls corpus::${line:0:200}"
          done

  browser-lab:
    # The real-browser lab (test/browser_lab_test.dart): a system
    # Chrome/Chromium driven headlessly proves the pre-pairing browser
    # scenarios - the token-only bridge where the token is the wire's
    # only door, the unpaired page gets no readable verdict while the
    # wire carries the literal code, and the preflight round trip
    # announces the token header with the new name alone. Zero packages
    # added: the lab uses whatever Chrome/Chromium the host has and
    # skips itself honestly on a machine without one (that skip is a
    # local-run behavior); this CI job has no such out - its image is
    # expected to ship a browser (the ubuntu-latest runner image lists
    # Google Chrome and Chromium), so a missing engine fails the job
    # instead of earning a green with nothing proved.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      # Name the browsers the lab ran on: the discovery order of the test
      # itself, echoed here so a green run records which engines proved
      # it. No green without a browser: this job exists to prove the lab
      # on real ones, so a missing engine fails the job instead of
      # warning - the honest skip stays a local-run behavior of the test
      # itself (BRIDGE_BROWSER / BRIDGE_GECKODRIVER), while a CI image
      # that lost its browsers is an environment drift this job must
      # surface as red. The Firefox scenes ride geckodriver over the same
      # WebDriver client, so the pair must be present the same way.
      - name: browsers on the runner image
        shell: bash
        run: |
          found=""
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "$b: $("$b" --version 2>/dev/null || echo 'present')"
              found="$b"
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::no system Chrome/Chromium on the runner image - the browser lab cannot prove anything without a real browser (the image is expected to ship one; treating that as green would fake the proof)."
            exit 1
          fi
          firefox_found=""
          if command -v firefox >/dev/null 2>&1; then
            echo "firefox: $(firefox --version 2>/dev/null || echo 'present')"
            firefox_found="firefox"
          fi
          gecko_found=""
          if command -v geckodriver >/dev/null 2>&1; then
            echo "geckodriver: $(geckodriver --version 2>/dev/null | head -n 1)"
            gecko_found="geckodriver"
          fi
          if [ -z "$firefox_found" ] || [ -z "$gecko_found" ]; then
            echo "::error::no Firefox+geckodriver pair on the runner image - the firefox scenes cannot prove anything without the real pair (the image is expected to ship both; treating that as green would fake the proof)."
            exit 1
          fi

      - name: resolve packages
        run: dart pub get

      # The expanded reporter plus the annotation grep, as in the matrix
      # test step: a red lab names its failing scenario.
      - name: browser lab
        shell: bash
        run: |
          status=0
          dart test -j 1 test/browser_lab_test.dart --reporter=expanded > "$RUNNER_TEMP/lab_out.txt" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            awk '/\[E\]/{c=8} c&&c-- {printf "::error::%s\n", substr($0,1,200)}' "$RUNNER_TEMP/lab_out.txt" | head -30 || true
          fi
          tail -n 3 "$RUNNER_TEMP/lab_out.txt" || true
          exit "$status"

      # The lab's own run durations and the Firefox session line (the
      # engine version the scenes ran on), as notice annotations - the
      # same lines the matrix job repeats after its suite, over two steps
      # for the ten-notice limit of one step.
      - name: browser run durations
        shell: bash
        if: always()
        run: |
          (grep -E "^(LAB-RUN|LAB-FIREFOX-SESSION|IDLE-BOUNDS):" "$RUNNER_TEMP/lab_out.txt" || true) > "$RUNNER_TEMP/lab_runs_only.txt"
          sed -n '1,10p' "$RUNNER_TEMP/lab_runs_only.txt" | while IFS= read -r line; do
            echo "::notice title=lab timing::${line:0,200}"
          done

      - name: browser run durations past the tenth
        shell: bash
        if: always()
        run: |
          (sed -n '11,60p' "$RUNNER_TEMP/lab_runs_only.txt" || true) | while IFS= read -r line; do
            echo "::notice title=lab timing::${line:0,200}"
          done

  safari-lab:
    # The real-Safari lab (test/safari_lab_test.dart): safaridriver drives
    # the runner's own Safari over the W3C WebDriver protocol with the
    # dart:io-only client in test/support/webdriver_client.dart - zero
    # packages added. The macOS image ships safaridriver, but Safari
    # automation must be enabled once per system (sudo safaridriver
    # --enable) - and a missing driver fails the job instead of earning a
    # green with nothing proved.
    #
    # The lab page and every bridge ride real TLS on loopback, so the job
    # generates its own short-lived test certificate (the SAN names
    # 127.0.0.1, ::1 and localhost, and the SAN is verified before
    # anything trusts it), documents it in a temporary keychain added to
    # the user's keychain search list, and removes that keychain and the
    # trust it granted in an always() cleanup step: the certificate lives
    # for the job alone, and a failed lab still tears the keychain down.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: environment versions (Safari and its driver)
        shell: bash
        run: |
          if ! command -v safaridriver >/dev/null 2>&1; then
            echo "::error::no safaridriver on the runner image - the safari lab cannot prove anything without the real driver."
            exit 1
          fi
          safaridriver --version 2>&1
          echo "Safari bundle version: $(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString)"

      - name: enable Safari automation
        run: sudo safaridriver --enable

      - name: resolve packages
        run: dart pub get

      # The temporary keychain: created, filled with the generated pair,
      # trusted for the job, and recorded for the always() cleanup - the
      # original search list rides along so the removal restores exactly
      # what was there.
      - name: loopback TLS certificate in a temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d "$RUNNER_TEMP/safari-lab-cert.XXXXXX")"
          cert="$workdir/bridge-lab.pem"
          key="$workdir/bridge-lab-key.pem"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -subj "/CN=bridge-lab-loopback" \
            -addext "subjectAltName=IP:127.0.0.1,IP:::1,DNS:localhost" \
            -keyout "$key" -out "$cert"
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -q "IP Address:127.0.0.1"
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -q "DNS:localhost"
          keychain="$workdir/bridge-lab.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_pass" "$keychain"
          search_before="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/^"//;s/"$//' | tr '\n' ' ' | sed -e 's/[[:space:]]*$//')"
          security list-keychains -d user -s "$keychain" $search_before
          security import "$cert" -k "$keychain" -P "$keychain_pass"
          security import "$key" -k "$keychain" -P "$keychain_pass"
          security add-trusted-cert -r trustRoot -k "$keychain" "$cert"
          {
            echo "BRIDGE_SAFARI_TLS_CERT=$cert"
            echo "BRIDGE_SAFARI_TLS_KEY=$key"
            echo "BRIDGE_SAFARI_KEYCHAIN=$keychain"
            echo "BRIDGE_SAFARI_SEARCH_BEFORE=$search_before"
          } >> "$GITHUB_ENV"
          echo "certificate: $(openssl x509 -in "$cert" -noout -subject -enddate)"
          echo "temporary keychain: $keychain"

      # The expanded reporter plus the annotation grep, as in the browser
      # lab step: a red lab names its failing scene.
      - name: safari lab
        shell: bash
        run: |
          status=0
          dart test -j 1 test/safari_lab_test.dart --reporter=expanded > "$RUNNER_TEMP/safari_out.txt" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            awk '/\[E\]/{c=8} c&&c-- {printf "::error::%s\n", substr($0,1,200)}' "$RUNNER_TEMP/safari_out.txt" | head -30 || true
          fi
          tail -n 3 "$RUNNER_TEMP/safari_out.txt" || true
          exit "$status"

      # The scenes' wall times and the driver-reported Safari version, as
      # notice annotations - the versions a green run ran on read from
      # the public API, not only from the admin-gated job log.
      - name: safari run durations
        shell: bash
        if: always()
        run: |
          (grep -E "^(LAB-RUN|LAB-SAFARI-SESSION):" "$RUNNER_TEMP/safari_out.txt" || true) | while IFS= read -r line; do
            echo "::notice title=safari lab::${line:0:200}"
          done

      # The temporary keychain and the trust it granted die with the job
      # whatever the lab's verdict was: restore the original search list,
      # untrust the certificate, delete the keychain, and prove the file
      # is gone - a surviving keychain is a red job, not a warning.
      - name: remove the temporary keychain (always)
        shell: bash
        if: always()
        run: |
          set -uo pipefail
          status=0
          keychain="${BRIDGE_SAFARI_KEYCHAIN:-}"
          cert="${BRIDGE_SAFARI_TLS_CERT:-}"
          before="${BRIDGE_SAFARI_SEARCH_BEFORE:-}"
          if [ -n "$before" ]; then
            # shellcheck disable=SC2086
            security list-keychains -d user -s $before || status=$?
          fi
          if [ -n "$cert" ] && [ -f "$cert" ]; then
            security remove-trusted-cert "$cert" || status=$?
            rm -f "$cert" "${BRIDGE_SAFARI_TLS_KEY:-}" || true
          fi
          if [ -n "$keychain" ]; then
            security delete-keychain "$keychain" || status=$?
          fi
          if [ -n "$keychain" ] && [ -e "$keychain" ]; then
            echo "::error::the temporary keychain survived its cleanup step - the job stays red."
            exit 1
          fi
          exit "$status"

  release-doc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: runner image
        run: |
          echo "runner image: ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      # Release gate for the files that reach pub.dev: rejects stale
      # pre-publication wording such as "not published yet (publish_to: none)"
      # or "repository is a placeholder". The patterns match the full stale
      # sentences, so prose that legitimately uses the word "placeholder" (for
      # example the changelog line about removing the placeholder homepage)
      # keeps passing. The gate is fail-closed on its own inputs: every
      # expected path must exist before the grep runs, and a grep that
      # errors (exit 2) fails the run instead of reading as "no match".
      - name: Reject stale pre-publication wording in published files
        shell: bash
        run: |
          for p in README.md README.ar.md CHANGELOG.md SECURITY.md pubspec.yaml lib example; do
            if [ ! -e "$p" ]; then
              echo "::error::release-doc-gate: expected published path '$p' is missing from the checkout - refusing to judge an incomplete file set."
              exit 1
            fi
          done
          pattern="not published|publish_to:[[:space:]]*['\"]?none|is a placeholder"
          grep_status=0
          grep -rniE -- "$pattern" README.md README.ar.md CHANGELOG.md SECURITY.md pubspec.yaml lib example || grep_status=$?
          if [ "$grep_status" -gt 1 ]; then
            echo "::error::release-doc-gate: the grep failed to run (exit $grep_status) - a gate that cannot scan must not pass."
            exit 1
          fi
          if [ "$grep_status" -eq 0 ]; then
            echo "::error::Stale pre-publication wording found in files published to pub.dev - see the matches above."
            exit 1
          fi
          echo "No stale pre-publication wording in files published to pub.dev."

  publish-gate:
    # Release-pipeline rehearsal: whatever pub.dev would receive must
    # document cleanly, pass the dry run without a single warning, and
    # then stand alone in an empty directory - resolve, analyze, test,
    # and stay CR-free. The working tree may contain more than the
    # archive does; this job judges the archive exactly.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: environment versions
        run: |
          echo "dart SDK: $(dart --version 2>&1)"
          echo "runner image: ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      - name: resolve packages
        run: dart pub get

      # Scratch files live outside the package tree ($RUNNER_TEMP): a
      # stray file inside the package root would enter the publish
      # listing itself.
      - name: doc (fails on warnings)
        run: |
          dart doc > "$RUNNER_TEMP/doc_output.txt" 2>&1 || { cat "$RUNNER_TEMP/doc_output.txt"; echo "::error::dart doc failed - see the output above."; exit 1; }
          grep -q '^Found 0 warnings and 0 errors\.$' "$RUNNER_TEMP/doc_output.txt" || { cat "$RUNNER_TEMP/doc_output.txt"; echo "::error::dart doc produced warnings or errors - see the output above."; exit 1; }
          echo "dart doc: zero warnings, zero errors."

      # The dry run is also the source of truth for the published file
      # set; its verdict line is captured verbatim for the next step.
      - name: publish dry-run (fails on any warning)
        run: |
          dart pub publish --dry-run > "$RUNNER_TEMP/dry_run.txt" 2>&1 || { cat "$RUNNER_TEMP/dry_run.txt"; echo "::error::publish --dry-run failed - see the output above."; exit 1; }
          grep -q '^Package has 0 warnings\.$' "$RUNNER_TEMP/dry_run.txt" || { cat "$RUNNER_TEMP/dry_run.txt"; echo "::error::publish --dry-run reported warnings - see the output above."; exit 1; }
          echo "publish --dry-run: zero warnings."

      # Copy the files the dry run listed - and only those - into an
      # empty directory, then resolve, analyze strictly, and test there.
      # The listing is a tree: nested entries show their name only, and
      # the prefix groups (bar or blank, one per level) carry the depth,
      # so the full relative path is rebuilt level by level; directory
      # entries carry no size. A text file carrying a CR character
      # fails the run, so the published bytes stay LF-only.
      - name: verify the published archive (exact file set, standalone, CR-free)
        run: |
          sed -e 's/│   /L/g' -e 's/    /L/g' "$RUNNER_TEMP/dry_run.txt" | awk '
            /── / {
              isfile = /\((<1|[0-9]+) (KB|B)\)$/
              line = $0
              if (isfile) sub(/ \((<1|[0-9]+) (KB|B)\)$/, "", line)
              idx = index(line, "── ")
              prefix = substr(line, 1, idx - 1)
              entry_depth = gsub(/L/, "L", prefix) + 1
              name = substr(line, idx + 3)
              while (level >= entry_depth) { delete stack[level]; level-- }
              if (isfile) {
                path = name
                for (i = level; i >= 1; i--) path = stack[i] "/" path
                print path
              } else {
                level++
                stack[level] = name
              }
            }
          ' > "$RUNNER_TEMP/file_list.txt"
          if [ ! -s "$RUNNER_TEMP/file_list.txt" ]; then
            echo "::error::could not parse the dry-run file list."
            exit 1
          fi
          listed="$(grep -c . "$RUNNER_TEMP/file_list.txt")"
          echo "files listed by the dry run: $listed"
          archive="$(mktemp -d)"
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "::error::the dry run lists '$f' but it is missing from the checkout."
              exit 1
            fi
            mkdir -p "$archive/$(dirname "$f")"
            cp "$f" "$archive/$f"
          done < "$RUNNER_TEMP/file_list.txt"
          copied="$(find "$archive" -type f | wc -l)"
          if [ "$copied" -ne "$listed" ]; then
            echo "::error::the archive holds $copied files but the dry run listed $listed."
            exit 1
          fi
          cd "$archive"
          dart pub get
          dart analyze --fatal-infos
          test_status=0
          dart test -j 1 --reporter=expanded > "$RUNNER_TEMP/archive_test_out.txt" 2>&1 || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            grep -E "MEM-WITNESS" "$RUNNER_TEMP/archive_test_out.txt" | while IFS= read -r line; do
              echo "::error::${line:0:200}"
            done || true
            awk '/\[E\]/{c=7} c&&c-- {printf "::error::%s\n", substr($0,1,200)}' "$RUNNER_TEMP/archive_test_out.txt" | head -40 || true
          fi
          tail -n 3 "$RUNNER_TEMP/archive_test_out.txt" || true
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          # No CR character may survive in any text file of the archive.
          # A scan that errors is a failure, not a pass: only exit 1
          # means "no match".
          cr_status=0
          cr_scan="$(grep -rIl "$(printf '\r')" . )" || cr_status=$?
          if [ "$cr_status" -gt 1 ]; then
            echo "::error::the CR scan failed to run (grep exit $cr_status)."
            exit 1
          fi
          if [ -n "$cr_scan" ] ; then
            printf '%s\n' "$cr_scan"
            echo "::error::CR characters found in the published archive - see the files above."
            exit 1
          fi
          echo "published archive verified: $listed files, CR-free, analyze and test green."

  pana:
    # The pub.dev score as pana computes it. It only runs where the
    # SCHEDULED_CI variable is "true", so repositories that did not opt
    # in do not spend minutes on it, and it fails the build below 160
    # points.
    if: vars.SCHEDULED_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: environment versions
        run: |
          echo "dart SDK: $(dart --version 2>&1)"
          echo "runner image: ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"

      - name: resolve packages
        run: dart pub get

      - name: pana (fails below 160 points)
        run: |
          dart pub global activate pana
          dart pub global run pana:pana . > pana_output.txt 2>&1 || true
          tail -n 25 pana_output.txt
          points="$(grep -E '^Points: [0-9]+/[0-9]+\.$' pana_output.txt | tail -n 1 | sed -E 's/^Points: ([0-9]+)\/[0-9]+\.$/\1/')"
          if [ -z "$points" ]; then
            echo "::error::could not read the pana score - see the output above."
            exit 1
          fi
          if [ "$points" -lt 160 ]; then
            echo "::error::pana score is ${points}, below the required 160."
            exit 1
          fi
          echo "pana score: ${points} - accepted."
